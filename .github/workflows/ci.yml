name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与生产环境一致（macOS CommandLineTools 的 3.9）；升级解释器前先在这改
          python-version: "3.9"
      - run: pip install -r requirements.txt
      # 三个测试全部离线：合成数据 + 内存库 + 注入的假数据源，不碰网络与真库
      - run: python -m pytest tests/ -q
